apiVersion: v1
kind: Service
metadata:
  name: {{ include "agency-os.controlPlaneService" . }}
  labels:
    {{- include "agency-os.labels" . | nindent 4 }}
    {{- include "agency-os.controlPlaneSelector" . | nindent 4 }}
spec:
  selector:
    {{- include "agency-os.controlPlaneSelector" . | nindent 4 }}
  ports:
    - name: http
      port: {{ .Values.controlPlane.port }}
      targetPort: http