name: dependency-patch
description: >-
  Routine dependency bump — shift-left security scan, dual-axis review, and
  parallel QA/perf verification. Skips architectural work on low-risk runs but
  never waives review, tests, or the deploy approval.
stages:
  - name: scan
    agentRole: security-engineer
    description: Identify outdated/vulnerable deps and breaking-change potential
  - name: architecture
    agentRole: architect
    lowRiskSkip: true
    description: Architectural impact assessment — unnecessary for low-risk bumps
  - name: patch
    agentRole: backend-engineer
    retry:
      maxAttempts: 2
  - name: review
    description: Two-axis review — dependency bumps can hide breaking changes
    fanOut:
      - name: standards-review
        agentRole: code-reviewer
        description: Standards, dependency hygiene
      - name: adversarial-review
        agentRole: adversarial-reviewer
        description: Supply-chain / transitive break analysis
  - name: tests
    description: Coverage + performance in parallel
    fanOut:
      - name: coverage-gate
        agentRole: qa-engineer
        description: Coverage gate on affected modules
      - name: perf-benchmark
        agentRole: performance-engineer
        lowRiskSkip: true
        description: Before/after benchmark on low-risk skips
  - name: deploy
    agentRole: devops-engineer
    approvalRequired: true
    approvalAction: deploy:staging
  - name: monitor
    agentRole: sre
    lowRiskSkip: true
    description: Long-tail regression watch for non-behavioral patches
