name: hotfix
description: >-
  Short, reversible remediation for production defects — now with dual-axis review
  and a QA gate. Reproduce first, minimal fix, two parallel reviews (standards +
  adversarial), security check, coverage gate, reversible deploy with approval,
  then SLO monitoring. Wall time stays low via parallel review.
stages:
  - name: reproduce
    agentRole: support-agent
    description: Reproduce the defect with evidence before any fix is attempted
  - name: fix
    agentRole: staff-engineer
    retry:
      maxAttempts: 3
  - name: review
    description: Two-axis review stays mandatory — hotfixes carry production risk
    fanOut:
      - name: standards-review
        agentRole: code-reviewer
        description: Standards, smells, tests quality
      - name: adversarial-review
        agentRole: adversarial-reviewer
        description: Spec-fidelity, attack cases
  - name: security
    agentRole: security-engineer
  - name: qa
    agentRole: qa-engineer
    description: Coverage gate on the fix (80/60) + acceptance criteria
  - name: deploy
    agentRole: devops-engineer
    approvalRequired: true
    approvalAction: deploy:staging
  - name: monitor
    agentRole: sre
    description: Confirm the remediation holds against the SLO after deploy
