name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Cancel superseded runs on the same ref to save CI minutes (best practice).
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: lint · typecheck · test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Approve esbuild postinstall (Windows sandbox policy)
        if: runner.os == 'Windows'
        run: npm approve-scripts esbuild || true

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit + integration + e2e tests
        run: npm test

      - name: Build dashboard
        run: npm run build --workspace @agency/dashboard

      - name: Environment self-test
        run: node scripts/self-test.mjs

  production-gate:
    name: production config gate
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Verify production gate logic executes
        env:
          NODE_ENV: local
        run: |
          # Gate must FAIL for non-production profiles (proves the gate works)
          if node scripts/verify-production.mjs; then
            echo "gate unexpectedly passed for local profile"; exit 1
          else
            echo "gate correctly rejects local profile"
          fi

  # Agency self-governance gate: runs the same monitor operators use locally.
  # Fails the build if any non-advisory gate regresses (DoR, secrets, DoD, SAST, threat, DORA).
  governance:
    name: agency workflow monitor (governance gate)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Run agency workflow monitor
        run: node scripts/workflow-monitor.mjs | tee monitor-report.txt
      - name: Fail on unhealthy pipeline
        run: |
          if grep -q "Pipeline NOT healthy" monitor-report.txt; then
            echo "workflow monitor reported an unhealthy pipeline"; exit 1
          fi
          echo "workflow monitor: pipeline healthy"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: workflow-monitor-report
          path: monitor-report.txt

  # End-to-end smoke (Playwright): the dashboard shell + key enterprise pages render.
  # Degrades gracefully if the control-plane is unreachable, but still proves the UI boots.
  e2e:
    name: e2e smoke (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
      - name: Run e2e smoke
        working-directory: apps/dashboard
        run: npx playwright test --reporter=line
